name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PEM }}
          script: |
            echo "Pulling image rishikale5/scrms-app:${{ github.event.inputs.tag }}"

            # Pull new image
            docker pull rishikale5/scrms-app:${{ github.event.inputs.tag }}

            # Stop old container
            docker stop scrms-app || true
            docker rm scrms-app || true

            # Run new container
            docker run -d -p 80:3000 --name scrms-app rishikale5/scrms-app:${{ github.event.inputs.tag }}

            echo "Deployment completed successfully!"
