name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PEM }}
          script: |
            sudo bash -c "cd ~/scrms-frontend && ./deploy.sh ${{ github.event.inputs.tag }}"
